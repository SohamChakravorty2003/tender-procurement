[project]
name = "email-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SohamChakravorty2003", email = "sohamcjojo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "langchain-groq>=1.1.3",
    "onnxruntime>=1.30.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rapidocr>=3.9.2",
    "uvicorn>=0.53.0",
    "yagmail>=0.16.0",
]

[project.scripts]
email-project = "email_project:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
